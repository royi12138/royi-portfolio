name: Resume MVP checks

on:
  pull_request:
    paths:
      - "ai-resume-agent-mvp/**"
      - ".github/workflows/resume-mvp-tests.yml"
  push:
    branches: [main]
    paths:
      - "ai-resume-agent-mvp/**"
      - ".github/workflows/resume-mvp-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-resume-agent-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-resume-agent-mvp/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -c "import re,pathlib; h=pathlib.Path('app/static/index.html').read_text(); pathlib.Path('/tmp/resume-ui.js').write_text(re.findall(r'<script>(.*?)</script>', h, re.S)[0])"
      - run: node --check /tmp/resume-ui.js
