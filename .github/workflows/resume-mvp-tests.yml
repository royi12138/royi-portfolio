name: Resume MVP checks

on:
  pull_request:
    paths:
      - "ai-resume-agent-mvp/**"
      - ".github/workflows/resume-mvp-tests.yml"
  push:
    branches: [main]
    paths:
      - "ai-resume-agent-mvp/**"
      - ".github/workflows/resume-mvp-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-resume-agent-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-resume-agent-mvp/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q
